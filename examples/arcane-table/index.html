<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcane table</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="overlay">
    <div id="title">Arcane Table</div>
    <div id="hint">
      Place a puck to open a <b>rune ring</b>.<br>
      Rotate it to sweep the pointer, then <b>touch the ring</b> to bind a rune.<br>
      Two pucks near each other <b>arc</b>.
    </div>
    <div id="status"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Template</title>
<style>
  /* The app is laid out at the table's real resolution. --mm comes from the SDK. */
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1115; }
  body { font-family: system-ui, sans-serif; color: #e6ebf2; }

  #hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; color: #6d7686;
    font-size: calc(6 * var(--mm)); line-height: 1.5;
  }

  .marker {
    position: absolute; left: 0; top: 0;
    width: calc(var(--puck-d) + 24 * var(--mm));
    height: calc(var(--puck-d) + 24 * var(--mm));
    margin-left: calc(-1 * (var(--puck-d) + 24 * var(--mm)) / 2);
    margin-top: calc(-1 * (var(--puck-d) + 24 * var(--mm)) / 2);
    border: calc(1 * var(--mm)) solid #4da3ff;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <div id="hint">Put a puck on the table.<br>Everything below is in <code>main.js</code>.</div>
  <script type="module" src="./main.js"></script>
</body>
</html>

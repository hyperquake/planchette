name: CI

# Runs on GitHub-hosted runners, never on our own machines: the repository is
# public, and a pull request from a fork runs its own code in this workflow.
# See docs/RUNNERS.md. Packaging is deliberately not done here; see release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:seed
      # Opens a real window; GitHub's macOS runners have a desktop session.
      # Gating here: this is the job that proves the packaged shell still works.
      - run: npm run smoke
      # The embeddable web build is a shipped artifact, so it gets the same
      # treatment. Builds its own copy with a relative base, so it must run after
      # nothing in particular but leaves dist/ built that way.
      - run: npm run smoke:embed

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:seed
      - run: npm run smoke
      # The embed artifact is platform independent, so running it on both runners
      # is redundant in principle; it is cheap, so it runs on both.
      - run: npm run smoke:embed

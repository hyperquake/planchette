# Build and publish a Planchette release for macOS and Windows.
#
# Each platform is packaged natively on its own machine: cross-building a Windows
# NSIS installer from macOS needs Wine, and cross-building a signed macOS bundle
# from anywhere else is not possible. The two jobs are independent and each
# publishes its own assets, so one platform failing does not block the other.
#
# Runs on GitHub-hosted runners, never on our own machines (docs/RUNNERS.md).
# Only people with write access can trigger it: a tag push or a manual run.
#
# To ship:
#   npm version 0.2.0 --no-git-tag-version
#   # retitle CHANGELOG.md's Unreleased section to 0.2.0 and date it
#   git commit -am "Release v0.2.0"
#   git tag -a v0.2.0 -m "Planchette 0.2.0"   # annotated: --follow-tags skips
#   git push --follow-tags                    # lightweight tags and pushes nothing
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to the triggering ref)'
        required: false

permissions:
  contents: write

env:
  # The tag being released, whether this was a tag push or a manual re-run.
  TAG: ${{ github.event.inputs.ref || github.ref_name }}

# One release at a time, so two runs never race to publish the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # electron-builder can produce the x64 build from an arm64 Mac but not the
      # other way round, so fail early and clearly rather than silently shipping
      # one architecture.
      - name: Confirm Apple Silicon
        run: |
          set -euo pipefail
          arch=$(uname -m)
          if [ "$arch" != "arm64" ]; then
            echo "::error::This runner is $arch. An arm64 Mac is needed to build both architectures."
            exit 1
          fi
          echo "runner arch: $arch"

      - run: npm ci

      # electron-builder names every artifact from the package.json version, so a
      # tag that disagrees produces a v0.2.0 release full of 0.1.0 files.
      - name: Tag must match package.json
        run: node scripts/check-version.mjs "${{ env.TAG }}"

      # Assembled here rather than just before publishing, so a changelog that
      # was never retitled stops the run in seconds instead of after a full
      # package. The file survives electron-builder and pack:web writing into
      # release/, and matches none of the upload globs below.
      - name: Assemble the release body
        run: node scripts/release-body.mjs

      - run: npm run check
      - run: npm run prepackage

      # Opens a real window, so it needs a logged-in desktop session. Advisory
      # during a release on purpose: a display problem should not block shipping.
      # ci.yml is where this gates.
      - name: Smoke test
        continue-on-error: true
        run: npm run smoke

      # Ad-hoc signs via scripts/adhoc-sign.cjs, which needs the Xcode command
      # line tools. Without a valid signature an arm64 build will not launch at
      # all, and macOS reports it as "damaged".
      # --publish never: electron-builder auto-publishes on a tag build in CI and
      # demands its own GH_TOKEN. Publishing is done explicitly below.
      - run: npx electron-builder --mac --publish never

      # The embeddable web build, for a site to pin a version of. Platform
      # independent, so it is only built here rather than on both runners.
      - run: npm run pack:web

      # A javascript action rather than the gh cli, for the same reason as the
      # windows job: it needs nothing but the runner's own node.
      - name: Publish release assets
        if: startsWith(env.TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Planchette ${{ env.TAG }}
          body_path: release/RELEASE_BODY.md
          draft: true
          files: |
            release/*.dmg
            release/planchette-web-*.zip
          fail_on_unmatched_files: true

      - name: Upload workflow artifacts (non-tag runs)
        if: ${{ !startsWith(env.TAG, 'v') }}
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/planchette-web-*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm ci

      - name: Tag must match package.json
        run: node scripts/check-version.mjs "${{ env.TAG }}"

      # Assembled here rather than just before publishing, so a changelog that
      # was never retitled stops the run in seconds instead of after a full
      # package. The file survives electron-builder and pack:web writing into
      # release/, and matches none of the upload globs below.
      - name: Assemble the release body
        run: node scripts/release-body.mjs

      - run: npm run check
      - run: npm run prepackage

      # Advisory, as on the mac job: ci.yml is where this gates.
      - name: Smoke test
        continue-on-error: true
        run: npm run smoke

      # See the mac job: build only, publish explicitly below.
      - run: npx electron-builder --win --publish never

      # A javascript action rather than the gh cli, so it needs nothing but the
      # runner's own node.
      - name: Publish release assets
        if: startsWith(env.TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Planchette ${{ env.TAG }}
          body_path: release/RELEASE_BODY.md
          draft: true
          files: release/*.exe
          fail_on_unmatched_files: true

      - name: Upload workflow artifacts (non-tag runs)
        if: ${{ !startsWith(env.TAG, 'v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

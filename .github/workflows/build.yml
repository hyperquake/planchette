name: Build desktop app

# Builds on self-hosted runners so each platform is packaged natively. Cross
# building a Windows installer from macOS needs Wine and is not worth the
# fragility when a real Windows runner is available.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  macos:
    # Adjust these labels to match your runner registration if they differ.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run build && npm run build:seed
      - run: npm run smoke
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: touch-table-sim-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run build && npm run build:seed
      # The smoke test opens a real window, so it needs an interactive desktop
      # session. Drop continue-on-error if your Windows runner has one.
      - run: npm run smoke
        continue-on-error: true
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: touch-table-sim-windows
          path: |
            release/*.exe
          if-no-files-found: error
